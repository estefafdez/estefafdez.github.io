# About section
about_profile_image: images/profile.jpg
about_content: |
  Hi! I'm Estefanía — a QA Automation Engineer with 10+ years of experience and a Master's in Software Engineering and Technology.

  I'm deeply passionate about Software Quality and test automation. Over the years I've built QA departments from the ground up, defined quality strategies, and led teams across international and multicultural environments. Currently I'm part of the QA team at <mark>Kaleidos</mark>, contributing to <mark>Penpot</mark> — an open-source design platform — which perfectly combines my love for quality and open source.

  My current focus is <mark>Playwright</mark> with TypeScript, exploring new programming frameworks and actively contributing to open source projects. I also enjoy sharing knowledge with the community through talks, workshops and blog posts.

  A few things about me:

  - 10+ years in QA, with experience building and leading QA teams from scratch.
  - Currently contributing to open source at Kaleidos (Penpot).
  - Skilled with <mark>Playwright</mark>, Selenium WebDriver and Appium.
  - Speaker and community contributor — talks, workshops and podcast appearances.
  - ISTQB® Foundation Level (CTFL) certified.
  - First Certificate in English (FCE) — strong communicator across international teams.
  - Detail-oriented, proactive and a true team player.

  Feel free to reach out at <mark>estefafdez@gmail.com</mark> or connect with me on social media — I'm always happy to talk about QA, testing and automation!

  Prefer a quick call? [Book a slot here](https://app.timetime.in/rp/estefafdez)

  Also check out my QA & Automation blog: [Una QA en Apuros](https://unaqaenapuros.wordpress.com/)

