- layout: left
  name: Penpot QA (Open Source)
  link: https://github.com/penpot/penpotqa
  description: |
    Active contributor to the QA automation suite of <mark>Penpot</mark>, the leading open-source design and collaboration platform by Kaleidos. Contributing E2E tests with <mark>Playwright</mark> and TypeScript to help ensure reliability for a tool used by thousands of designers and developers worldwide.

    **Technologies:** Playwright, TypeScript, GitHub Actions.

- layout: left
  name: Playwright Template
  link: https://github.com/estefafdez/playwright-template
  description: |
    Production-ready <mark>Playwright</mark> template with everything you need to start automating from day one. Designed as a solid, reusable foundation for modern E2E automation projects.

    - Page Object Model pattern
    - API testing included
    - GitHub Actions CI/CD pipeline
    - Qase integration for test management
    - SonarCloud for code quality

    **Technologies:** Playwright, TypeScript, Node, GitHub Actions, Qase, SonarCloud.

- layout: left
  name: Cypress Template
  link: https://github.com/estefafdez/cypress-template
  description: |
    Production-ready <mark>Cypress</mark> template for E2E and API testing, structured for real-world projects.

    - Page Object Model pattern
    - API testing included
    - GitHub Actions CI/CD pipeline
    - Qase integration for test management
    - SonarCloud for code quality

    **Technologies:** Cypress, TypeScript, Node, GitHub Actions, Qase, SonarCloud.

- layout: left
  name: Cypress Component Testing
  link: https://github.com/estefafdez/cypress-component
  description: |
    Demo project showcasing <mark>Cypress Component Testing</mark> with a Counter React component — a practical example of testing UI components in isolation without needing a full browser environment.

    [Watch the talk](https://www.youtube.com/watch?v=OK8i2ExZl-o) · [View the Genially](https://view.genial.ly/64536a9a3140d6001274a16a)

