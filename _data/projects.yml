    <mark>Selenium WebDriver</mark> integrated with <mark>Cucumber</mark> for BDD-style test automation in Java. Includes a rich set of predefined steps, multi-browser and multi-OS support via POM configuration, and SonarQube for code quality.

    **Technologies:** Selenium WebDriver, Cucumber, Java, TestNG, JUnit, Maven, SonarQube, Docker.

